[package]
name = "handbook"
version = "0.5.3"
description = "Handbook: a text editor that writes in your own handwriting"
authors = []
license = ""
repository = "https://github.com/rostislav-kuparo/handbook"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "handbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
