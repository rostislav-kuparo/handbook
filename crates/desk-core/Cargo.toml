[package]
name = "desk-core"
version = "0.1.0"
edition = "2021"
description = "Photo analysis for writing onto a photographed sheet: finding the sheet, its edges, blur, noise, highlights, pen colour"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"

[dev-dependencies]
# Reads the real photos of the local tests (fixtures/real, not in git).
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Skip binaryen's wasm-opt (it would be downloaded at build time); size is not critical locally.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
