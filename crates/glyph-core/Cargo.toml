[package]
name = "glyph-core"
version = "0.1.0"
edition = "2021"
description = "Handwriting glyph engine: stroke processing, variant synthesis, font compilation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
i_overlay = "9.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
write-fonts = { version = "0.54.0", features = ["read"] }

[dev-dependencies]
rustybuzz = "0.20.1"

# Skip binaryen's wasm-opt (it would be downloaded at build time); size is not critical locally.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
